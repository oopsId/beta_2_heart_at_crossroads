name: Stage 0J migrate

on:
  push:
    branches:
      - stage-0j-render-phone-final
    paths:
      - .github/workflows/stage0j-migrate.yml
      - tools/stage0j_migrate.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-0j-render-phone-final
      - name: Apply Stage 0J migration
        run: python3 tools/stage0j_migrate.py
      - name: Commit migrated game files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heart_at_crossroads.html assets/data/chapter2.json tools/runtime_smoke.mjs
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "Stage 0J: wire atomic renderer and compose phone scene"
          git push origin HEAD:stage-0j-render-phone-final
