name: Restore red background placeholder

on:
  push:
    branches:
      - fix-restore-red-background-placeholder

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-restore-red-background-placeholder
          fetch-depth: 0

      - name: Restore authored missing-background marker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('assets/data/finals.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          ending = next(item for item in data['endings'] if item['id'] == 'friendship_above_all')
          scene = next(item for item in ending['scenes'] if item['id'] == 0)
          if scene.get('background') != 'bg_webstudio_day':
              raise SystemExit(f"unexpected current Vika background: {scene.get('background')!r}")
          scene['background'] = 'bg_webstudio_day_summer'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          PY

          cp assets/backgrounds/bg_road_day_summer.png assets/backgrounds/bg_webstudio_day_summer.png
          test "$(git hash-object assets/backgrounds/bg_webstudio_day_summer.png)" = "$(git hash-object assets/backgrounds/bg_road_day_summer.png)"

      - name: Validate structural invariants
        run: |
          set -euo pipefail
          python3 tools/validate_architecture.py
          python3 tools/validate_game.py
          python3 tools/validate_eligibility.py

      - name: Commit deterministic fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/data/finals.json assets/backgrounds/bg_webstudio_day_summer.png
          git diff --cached --check
          git commit -m "Restore Vika ending red background placeholder"
          git push origin HEAD:fix-restore-red-background-placeholder
