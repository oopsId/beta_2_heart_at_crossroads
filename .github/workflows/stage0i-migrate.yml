name: Stage 0I migration

on:
  push:
    branches:
      - stage-0i-eligibility-and-runtime
    paths:
      - .github/workflows/stage0i-migrate.yml
      - tools/stage0i_finalize.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-0i-eligibility-and-runtime
          fetch-depth: 2
      - name: Apply Stage 0I final cleanup
        run: python3 tools/stage0i_finalize.py
      - name: Restore untouched chapters from main exactly
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- \
            assets/data/chapter4.json \
            assets/data/chapter5.json \
            assets/data/chapter7.json \
            assets/data/chapter8.json \
            assets/data/chapter9.json
      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data tools/runtime_smoke.mjs tools/validate_game.py
          if git diff --cached --quiet; then
            echo "No final cleanup changes"
          else
            git commit -m "Stage 0I: finalize validation and clean data diff"
            git push origin HEAD:stage-0i-eligibility-and-runtime
          fi
