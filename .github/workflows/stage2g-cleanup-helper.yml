name: Stage 2G cleanup helper
on:
  push:
    branches: [stage-2g-production-cleanup]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-2g-production-cleanup
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/runtime/replay-progression.js');s=p.read_text(encoding='utf-8')
          a=s.index("    const style=document.createElement('style');");m='document.head.appendChild(style);\n';b=s.index(m,a)+len(m);s=s[:a]+s[b:]
          s=s.replace('__stage0kSecondPlaythroughText','__heartSecondPlaythroughText')
          x='window.stage0kDevForceFirstPlaythrough=devForceFirstPlaythrough;window.stage0kSetDevForceFirstPlaythrough=setDevForceFirstPlaythrough;window.stage0kApplyReplayOverride=applyReplayOverride;\n';s=s.replace(x,x+'    window.heartDevForceFirstPlaythrough=devForceFirstPlaythrough;window.heartSetDevForceFirstPlaythrough=setDevForceFirstPlaythrough;window.heartApplyReplayOverride=applyReplayOverride;\n',1)
          x='window.stage2dRouteStrength=routeStrength;window.stage2dEndingSelectable=stage0iEndingEligible;window.stage2dLegacyEndingEligible=legacyEndingEligible;window.stage2dEndingProfiles=profiles;\n';s=s.replace(x,x+'    window.heartRouteStrength=routeStrength;window.heartEndingSelectable=stage0iEndingEligible;window.heartEndingProfiles=profiles;\n',1);p.write_text(s,encoding='utf-8')
          p=Path('assets/css/phone.css');s=p.read_text(encoding='utf-8').replace('--stage0o-phone-','--phone-overlay-');s+='''\nhtml body.stage0j-compose-scene #phone-compose-overlay{left:50%!important;transform:translateX(-50%)!important;width:clamp(260px,18vw,320px)!important;min-width:0!important;min-height:0!important;max-height:none!important}\n#phone-compose-overlay .stage0j-phone-screen{background:#dcebd5 url('../backgrounds/bg_phone_ui.png') center/cover no-repeat!important}\n@media(max-width:800px){html body.stage0j-compose-scene #phone-compose-overlay{width:clamp(190px,48vw,240px)!important}}\n@media(max-height:520px) and (orientation:landscape){html body.stage0j-compose-scene #phone-compose-overlay{width:min(150px,24vw)!important}}\n''';p.write_text(s,encoding='utf-8')
          p=Path('assets/css/hud.css');s=p.read_text(encoding='utf-8');s+='''\n#stage0k-dev-replay-control{position:fixed;left:12px;bottom:10px;z-index:5005;display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:8px;background:rgba(20,20,20,.68);color:#fff;font:12px/1.2 Arial,sans-serif;pointer-events:auto;user-select:none}\n#stage0k-dev-replay-control input{margin:0}\n''';p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/runtime/replay-progression.js assets/css/phone.css assets/css/hud.css
          git commit -m 'Stage 2G: move runtime styling to CSS'
          git push origin HEAD:stage-2g-production-cleanup
