name: Stage 0K patch

on:
  push:
    branches:
      - stage-0k-compose-layout-hotfix
    paths:
      - .github/workflows/stage0k-patch.yml
      - tools/stage0k_patch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-0k-compose-layout-hotfix
      - name: Apply Stage 0K patch
        run: python3 tools/stage0k_patch.py
      - name: Commit Stage 0K patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heart_at_crossroads.html assets/data/chapter2.json tools/runtime_smoke.mjs
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "Stage 0K: fix compose layout and replay dev mode"
          git push origin HEAD:stage-0k-compose-layout-hotfix
