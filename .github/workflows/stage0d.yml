name: Stage 0D transition engine

on:
  push:
    branches:
      - stage0d-transition-engine
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage0d-transition-engine

      - name: Apply Stage 0D migration
        run: python3 tools/stage0d_apply.py

      - name: Verify transition invariants
        run: |
          grep -n "function resolveSceneTransition(scene)" heart_at_crossroads.html
          grep -n "async function transitionTo(target, options = {})" heart_at_crossroads.html
          grep -n "async function applyChoice(choice, options = {})" heart_at_crossroads.html
          grep -n "reason: 'terminal-null'" heart_at_crossroads.html
          grep -n "reason: 'legacy-implicit-next'" heart_at_crossroads.html
          ! grep -n "fallback переход к сцене\|const handleFallbackNext\|function handleNextScene(" heart_at_crossroads.html
          test "$(grep -c "function resolveEndingId(" heart_at_crossroads.html)" -eq 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start Pages-like server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/stage0d-http.log 2>&1 &
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/heart_at_crossroads.html >/dev/null

      - name: Browser transition gate
        run: node tools/stage0d_smoke.mjs

      - name: Commit generated Stage 0D HTML
        run: |
          if git diff --quiet -- heart_at_crossroads.html; then
            echo 'No generated HTML changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heart_at_crossroads.html
          git commit -m 'Apply Stage 0D transition engine'
          git push origin HEAD:stage0d-transition-engine

      - name: Server log on failure
        if: failure()
        run: cat /tmp/stage0d-http.log || true
