name: Stage 0G runtime lifecycle gate

on:
  push:
    branches:
      - stage0g-runtime-lifecycle

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 0G branch
        uses: actions/checkout@v4
        with:
          ref: stage0g-runtime-lifecycle

      - name: Apply Stage 0G migration
        run: python3 tools/stage0g_apply.py

      - name: Static lifecycle validator
        run: python3 tools/stage0g_validate.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start Pages-like server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/stage0g-http.log 2>&1 &
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/heart_at_crossroads.html >/dev/null

      - name: Chromium lifecycle gate
        run: node tools/stage0g_smoke.mjs

      - name: Commit generated Stage 0G runtime
        run: |
          if git diff --quiet -- heart_at_crossroads.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heart_at_crossroads.html
          git commit -m 'Apply Stage 0G runtime lifecycle cancellation'
          git push origin HEAD:stage0g-runtime-lifecycle

      - name: Server log on failure
        if: failure()
        run: cat /tmp/stage0g-http.log || true
