name: Refactor branch helper
on:
  push:
    branches: [main]
    paths: [.github/workflows/refactor-branch-helper.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-1d-split-core-runtime
          fetch-depth: 0
      - run: python3 tools/stage1d_split.py
      - run: |
          node --check assets/js/core/foundation.js
          node --check assets/js/core/story-runtime.js
          node --check assets/js/core/gallery-legacy.js
          node --check assets/js/core/endings-presentation.js
          python3 -m py_compile tools/validate_game.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A assets/js/core assets/js/core-runtime.js heart_at_crossroads.html tools/validate_game.py
          git commit -m 'Stage 1D: split core runtime into ordered modules'
          git push origin HEAD:stage-1d-split-core-runtime
