name: Refactor branch helper
on:
  push:
    branches: [main]
    paths: [.github/workflows/refactor-branch-helper.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-1b-core-js-extraction
          fetch-depth: 0
      - run: python3 tools/validator_external_core_patch.py
      - run: |
          python3 -m py_compile tools/validate_game.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/validate_game.py
          git commit -m 'Stage 1B: validate external core runtime'
          git push origin HEAD:stage-1b-core-js-extraction
