name: Stage 0I fallback fix

on:
  push:
    branches:
      - stage-0i-eligibility-and-runtime
    paths:
      - .github/workflows/stage0i-fallback-fix.yml
      - tools/stage0i_fallback_fix.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-0i-eligibility-and-runtime
      - name: Apply fallback fix
        run: python3 tools/stage0i_fallback_fix.py
      - name: Commit fixed runtime data and validators
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/finals.json tools/validate_eligibility.py tools/runtime_smoke.mjs
          git commit -m "Stage 0I: guarantee New Start fallback"
          git push origin HEAD:stage-0i-eligibility-and-runtime
