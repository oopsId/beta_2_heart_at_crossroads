name: Stage 0C save-state repair

on:
  push:
    branches:
      - stage0c-save-state
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage0c-save-state

      - name: Apply Stage 0C migration
        run: python3 tools/stage0c_apply.py

      - name: Verify storage invariants
        run: |
          ! grep -n "'gameSession'\|'last_session'\|Telegram.WebApp\|CloudStorage" heart_at_crossroads.html
          grep -n "heart_at_crossroads_beta2:v1:" heart_at_crossroads.html
          grep -n "RUN_STORAGE_KEY = 'run'" heart_at_crossroads.html
          grep -n "PROFILE_STORAGE_KEY = 'profile'" heart_at_crossroads.html

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local Pages-like server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/stage0c-http.log 2>&1 &
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/heart_at_crossroads.html >/dev/null

      - name: Browser save/continue/menu gate
        run: node tools/stage0c_smoke.mjs

      - name: Commit generated Stage 0C HTML
        run: |
          if git diff --quiet -- heart_at_crossroads.html; then
            echo 'No generated HTML changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heart_at_crossroads.html
          git commit -m 'Apply Stage 0C save-state repair'
          git push origin HEAD:stage0c-save-state

      - name: Server log on failure
        if: failure()
        run: cat /tmp/stage0c-http.log || true
