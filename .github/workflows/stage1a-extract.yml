name: Stage 1A extraction helper

on:
  push:
    branches:
      - stage-1a-css-extraction
    paths:
      - .github/workflows/stage1a-extract.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-1a-css-extraction
      - name: Extract inline CSS
        run: python3 tools/stage1a_extract.py
      - name: Verify extraction diff
        run: |
          git diff --check
          test -s assets/css/game.css
          grep -q 'assets/css/game.css' heart_at_crossroads.html
          ! grep -q '<style>' heart_at_crossroads.html
      - name: Commit generated extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heart_at_crossroads.html assets/css/game.css
          git commit -m 'Stage 1A: extract monolith CSS'
          git push origin HEAD:stage-1a-css-extraction
