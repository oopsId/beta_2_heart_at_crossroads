name: Normalize Stage 0A-0B HTML line endings

on:
  push:
    branches:
      - stage0a-0b-browser-isolation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage0a-0b-browser-isolation
      - name: Restore CRLF used by the original HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('heart_at_crossroads.html')
          data = p.read_bytes().replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
          p.write_bytes(data)
          PY
      - name: Commit normalization
        run: |
          if git diff --quiet -- heart_at_crossroads.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heart_at_crossroads.html
          git commit -m 'Preserve original HTML line endings'
          git push origin HEAD:stage0a-0b-browser-isolation
