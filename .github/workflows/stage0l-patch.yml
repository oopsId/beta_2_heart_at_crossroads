name: Stage 0L patch

on:
  push:
    branches:
      - stage0l-phone-avatars
    paths:
      - .github/workflows/stage0l-patch.yml
      - tools/stage0l_patch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage0l-phone-avatars
      - name: Install image dependency
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Apply Stage 0L patch
        run: python3 tools/stage0l_patch.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/chapter1.json assets/data/chapter3.json assets/data/chapter6.json assets/characters/dima/dima_messenger_ava.png tools/runtime_smoke.mjs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Stage 0L: replace legacy timed phone overlays"
          git push origin HEAD:stage0l-phone-avatars
