name: Stage 0I regression gate

on:
  push:
    branches:
      - stage-0i-eligibility-and-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Existing structural validator
        run: python3 tools/validate_game.py
      - name: Ending eligibility reachability gate
        run: python3 tools/validate_eligibility.py

  browser:
    needs: structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start Pages-like server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/game-http.log 2>&1 &
          sleep 1
          curl --fail --silent http://127.0.0.1:8000/heart_at_crossroads.html >/dev/null
      - name: Permanent runtime smoke including Stage 0I
        run: node tools/runtime_smoke.mjs
      - name: Server log on failure
        if: failure()
        run: cat /tmp/game-http.log || true
