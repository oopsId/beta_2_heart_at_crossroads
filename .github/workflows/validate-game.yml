name: Validate game runtime

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    name: Structural game validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate architecture, chapters, routes, assets and runtime invariants
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 tools/validate_architecture.py | tee artifacts/architecture-validation.txt
          python3 tools/validate_game.py --report artifacts/structural-validation.json
          python3 tools/validate_eligibility.py | tee artifacts/eligibility-validation.json
      - name: Upload structural report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-validation
          path: |
            artifacts/architecture-validation.txt
            artifacts/structural-validation.json
            artifacts/eligibility-validation.json
          if-no-files-found: ignore

  browser:
    name: Chromium runtime smoke
    needs: structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start Pages-like server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/game-http.log 2>&1 &
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/heart_at_crossroads.html >/dev/null
      - name: Run browser regression smoke
        run: |
          set -o pipefail
          mkdir -p artifacts
          node tools/runtime_smoke.mjs | tee artifacts/runtime-smoke.json
          node tools/stage2d_smoke.mjs | tee artifacts/stage2d-smoke.json
          node tools/mode_smoke.mjs | tee artifacts/mode-smoke.json
          node tools/stats_panel_smoke.mjs | tee artifacts/stats-panel-smoke.json
          node tools/mobile_layout_smoke.mjs | tee artifacts/mobile-layout-smoke.json
          node tools/gallery_smoke.mjs | tee artifacts/gallery-smoke.json
          node tools/stage0o_smoke.mjs | tee artifacts/stage0o-smoke.json
          node tools/stage0o_continue_smoke.mjs
          node tools/stage0o_landscape_smoke.mjs
          node tools/stage0p_gallery_polish_smoke.mjs
          node tools/stage0q_hud_smoke.mjs
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke
          path: |
            artifacts/runtime-smoke.json
            artifacts/stage2d-smoke.json
            artifacts/mode-smoke.json
            artifacts/stats-panel-smoke.json
            artifacts/mobile-layout-smoke.json
            artifacts/mobile-character-layout.png
            artifacts/mobile-phone-layout.png
            artifacts/gallery-smoke.json
            artifacts/stage0o-smoke.json
          if-no-files-found: ignore
      - name: Server log on failure
        if: failure()
        run: cat /tmp/game-http.log || true
