name: Stage 0E timed choice scan

on:
  push:
    branches:
      - stage0e-timed-choice
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan timed scenes
        run: python3 tools/stage0e_scan.py
