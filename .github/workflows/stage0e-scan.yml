name: Stage 0E timed choice gate

on:
  push:
    branches:
      - stage0e-timed-choice
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage0e-timed-choice

      - name: Apply Stage 0E migration
        run: python3 tools/stage0e_apply.py

      - name: Validate timeout schema
        run: python3 tools/stage0e_validate.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start Pages-like server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/stage0e-http.log 2>&1 &
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/heart_at_crossroads.html >/dev/null

      - name: Browser timed-choice gate
        run: node tools/stage0e_smoke.mjs

      - name: Commit generated Stage 0E files
        run: |
          if git diff --quiet -- heart_at_crossroads.html assets/data/chapter*.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heart_at_crossroads.html assets/data/chapter*.json
          git commit -m 'Apply Stage 0E explicit timeout outcomes'
          git push origin HEAD:stage0e-timed-choice

      - name: Server log on failure
        if: failure()
        run: cat /tmp/stage0e-http.log || true
