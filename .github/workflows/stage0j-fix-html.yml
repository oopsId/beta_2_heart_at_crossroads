name: Stage 0J fix HTML

on:
  push:
    branches:
      - stage-0j-render-phone-final
    paths:
      - .github/workflows/stage0j-fix-html.yml
      - tools/stage0j_fix_html.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-0j-render-phone-final
          fetch-depth: 0
      - name: Restore main HTML byte format and insert Stage 0J tag
        run: python3 tools/stage0j_fix_html.py
      - name: Commit clean HTML diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heart_at_crossroads.html
          if git diff --cached --quiet; then
            echo "No HTML change"
            exit 0
          fi
          git commit -m "Stage 0J: preserve HTML line endings"
          git push origin HEAD:stage-0j-render-phone-final
