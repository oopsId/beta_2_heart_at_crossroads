name: Stage 0F ending integrity gate

on:
  push:
    branches:
      - stage0f-ending-integrity

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 0F branch
        uses: actions/checkout@v4
        with:
          ref: stage0f-ending-integrity

      - name: Apply Stage 0F migration
        run: python3 tools/stage0f_apply.py

      - name: Validate ending ownership schema
        run: python3 tools/stage0f_validate.py

      - name: Install Chromium runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start Pages-like server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/stage0f-http.log 2>&1 &
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/heart_at_crossroads.html >/dev/null

      - name: Chromium ending-integrity gate
        run: node tools/stage0f_smoke.mjs

      - name: Commit generated Stage 0F files
        run: |
          if git diff --quiet -- heart_at_crossroads.html assets/data/chapter10.json assets/data/finals.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heart_at_crossroads.html assets/data/chapter10.json assets/data/finals.json
          git commit -m 'Apply Stage 0F deterministic ending ownership'
          git push origin HEAD:stage0f-ending-integrity

      - name: Server log on failure
        if: failure()
        run: cat /tmp/stage0f-http.log || true
