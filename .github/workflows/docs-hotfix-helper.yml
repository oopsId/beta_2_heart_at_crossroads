name: Stage 2D docs accuracy hotfix

on:
  push:
    branches: [stage-2g-docs-hotfix]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-2g-docs-hotfix
      - name: Correct Stage 2D design contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/stage2d_endings_economy_plan.txt')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'chapter1, scene 3, choice "new_start":': 'chapter1, scene 3, choice "premium":',
              'strong: mark >= 3 И (heart >= 10 ИЛИ leaf >= 8)\nmixed: mark >= 1 ИЛИ heart >= 8 ИЛИ leaf >= 6': 'strong: mark >= 4 И heart >= 12 И leaf >= 8\nmixed: mark >= 2 ИЛИ heart >= 10 ИЛИ leaf >= 8',
              'strong: sergey >= 2 И crown >= 4\nmixed: sergey >= 1 ИЛИ crown >= 3': 'strong: sergey >= 3 И crown >= 5\nmixed: sergey >= 1 ИЛИ crown >= 3',
              'strong: crown >= 5 И crown + 3 >= heart И crown + 3 >= leaf\nmixed: crown >= 4': 'strong: crown >= 4 И crown + 4 >= heart И crown + 4 >= leaf\nmixed: crown >= 3',
              'Финальный choice "Мне нужно время" переименовать технически с id "new_start" на смысловой id (например new_start/time), потому что он бесплатный и не является premium purchase.': 'Финальный choice "Мне нужно время" переименовать технически с исторического id "premium" на "new_start", потому что он бесплатный и не является premium purchase.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing replacement anchor: {old!r}')
              text = text.replace(old, new, 1)
          text += '''\n\n============================================================\n7. РЕЗУЛЬТАТ РЕАЛИЗАЦИИ STAGE 2D\n============================================================\n\nStage 2D реализован. Пользовательская доступность всех шести финальных выборов = 100%.\nНакопленные решения больше не блокируют концовку; они вычисляют скрытый routeStrength.\n\nФинальная калибровка strong по exact reachability-report:\n- Dima: 37.07%\n- Mark: 14.33%\n- Sergey: 42.16%\n- Vika: 17.71%\n- Alone: 9.95%\n- New Start: intentional 100%\n\nЭкономика после реализации:\n- initial bank: 70\n- completion reward: +100 после завершения эпилога/completionCount\n- chapter1 optional paid dialogue: 5\n- gallery paid cards: 50 + 50 после первого completion, только ручная покупка\n- replay gallery cards: бесплатное ручное открытие после completionCount >= 2\n- persistent diamond bank является источником истины при Continue/reload\n- трата сохраняется в bank до сохранения run, поэтому старый run не может воскресить предыдущий баланс\n\nТехническая миграция финального выбора:\n- chapter10 New Start: id `new_start`, endingId `new_start`, без cost\n- chapter1 платная дополнительная реплика остаётся id `premium`, cost 5\n\n`legacyRequirements` из finals удалены. Executable `requirements` могут оставаться только как историческая/аналитическая база старого evaluator; пользовательский UI их больше не использует как замки.\n'''
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit docs correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/stage2d_endings_economy_plan.txt
          git commit -m 'Docs: align Stage 2D contract with implemented calibration'
          git push origin HEAD:stage-2g-docs-hotfix
