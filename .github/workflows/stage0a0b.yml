name: Stage 0A-0B browser isolation

on:
  push:
    branches:
      - stage0a-0b-browser-isolation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage0a-0b-browser-isolation

      - name: Apply Stage 0A and 0B migration
        run: python3 tools/stage0a0b_apply.py

      - name: Verify migration invariants
        run: |
          python3 tools/stage0a0b_apply.py --check
          ! grep -R --line-number --fixed-strings '/heart_at_crossroads/' heart_at_crossroads.html index.html
          ! grep -R --line-number -E 'telegram\.org/js/telegram-web-app\.js|Telegram\.WebApp|CloudStorage|authorized_users|const userId|const isTelegram|let isTelegram' heart_at_crossroads.html

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start Pages-like local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/stage0a0b-http.log 2>&1 &
          echo $! > /tmp/stage0a0b-http.pid
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/heart_at_crossroads.html >/dev/null

      - name: Browser smoke gate
        run: node tools/stage0a0b_smoke.mjs

      - name: Commit generated migration
        run: |
          if git diff --quiet -- heart_at_crossroads.html index.html; then
            echo 'No generated migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heart_at_crossroads.html index.html
          git commit -m 'Apply Stage 0A and 0B browser isolation'
          git push origin HEAD:stage0a-0b-browser-isolation

      - name: Server log on failure
        if: failure()
        run: cat /tmp/stage0a0b-http.log || true
