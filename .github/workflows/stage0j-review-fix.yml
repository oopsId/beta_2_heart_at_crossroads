name: Stage 0J review fix

on:
  push:
    branches:
      - stage-0j-render-phone-final
    paths:
      - .github/workflows/stage0j-review-fix.yml
      - tools/stage0j_review_fix.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-0j-render-phone-final
      - name: Apply review fixes
        run: python3 tools/stage0j_review_fix.py
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/stage0j-runtime.js tools/runtime_smoke.mjs
          if git diff --cached --quiet; then
            echo "No review-fix changes"
            exit 0
          fi
          git commit -m "Stage 0J: fix compose phone layout edges"
          git push origin HEAD:stage-0j-render-phone-final
